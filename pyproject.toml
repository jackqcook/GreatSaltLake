[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsl-dust"
version = "0.1.0"
description = "Great Salt Lake dust and arsenic transport model, built to GSL_Dust_Model_Guide.pdf"
requires-python = ">=3.11"
dependencies = [
  "numpy", "pandas", "scipy", "pyarrow", "requests", "matplotlib",
  "rasterio", "pyproj", "shapely", "scikit-learn", "pdfplumber",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
